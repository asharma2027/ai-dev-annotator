name: Desktop dashboard

on:
  push:
    branches: [main, prod]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci --prefix desktop-app --no-audit --no-fund
      - run: npm run check
      - name: Package universal macOS app
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm --prefix desktop-app run build -- --universal
      - name: Package x64 Windows app
        if: runner.os == 'Windows'
        run: npm --prefix desktop-app run build -- --x64
