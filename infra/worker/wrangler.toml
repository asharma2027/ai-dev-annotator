name = "ai-dev-annotator-licenses"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Secrets are NOT defined here — set them with `wrangler secret put`:
#   STRIPE_WEBHOOK_SECRET   — from Stripe dashboard, the webhook signing secret
#   LICENSE_PRIVATE_KEY     — Ed25519 private key, base64url, no padding
#   RESEND_API_KEY          — from resend.com, an API key with send permission
#   SENDER_EMAIL            — e.g. "AI Dev Annotator <licenses@yourdomain.com>"
#   PREMIUM_PRICE_ID        — Stripe Price ID for the $9.99 Premium SKU (optional;
#                             used to distinguish Premium purchases from tips)
